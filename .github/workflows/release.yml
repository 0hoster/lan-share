name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 创建 Release 需要写权限；新建仓库的 GITHUB_TOKEN 默认是只读。
permissions:
  contents: write

jobs:
  cross:
    name: 交叉编译（单机产出全平台）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # runner 自带 rustup，跳过私有工具链安装，只补 zig + cargo-zigbuild
      - name: 准备交叉工具链
        env:
          SKIP_RUSTUP: "1"
        run: bash scripts/setup-cross.sh

      - name: 构建 Linux / Windows / macOS 产物
        run: bash scripts/build-cross.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: lan-share-dist
          path: dist/*
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lan-share-*.tar.gz
            dist/lan-share-*.zip
            dist/SHA256SUMS.txt

  native:
    name: 原生构建 + 端到端测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: target/release/lan-share
          - os: macos-latest
            bin: target/release/lan-share
          - os: windows-latest
            bin: target/release/lan-share.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: 构建 release
        run: cargo build --release --locked

      - name: 代码规范（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings

      - name: 启动服务并跑端到端测试
        shell: bash
        run: |
          # GitHub 会给 bash 步骤隐式加上 -e（bash -eo pipefail），必须显式关掉，
          # 否则测试一旦非零退出，步骤会立刻结束，下面的诊断输出全部丢失。
          set +e
          set -uo pipefail
          bin="./${{ matrix.bin }}"
          # 用随机高端口，避免和 runner 上其它服务撞端口
          port=$(( (RANDOM % 20000) + 30000 ))
          base="http://127.0.0.1:$port"
          tmp="${RUNNER_TEMP:-/tmp}"
          log="$tmp/lan-share-server.log"
          out="$tmp/lan-share-e2e.log"

          echo "::notice::[1] bash=${BASH_VERSION:-?} bin=$bin port=$port tmp=$tmp"
          echo "binary  : $bin"
          mkdir -p "$tmp"
          ls -l "$bin" || { echo "::error::找不到可执行文件 $bin"; exit 1; }

          "$bin" --port "$port" --data-dir "$tmp/lan-share-data" >"$log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 30); do
            # 必须确认响应的确是本服务的页面，而不是恰好占用该端口的其它服务
            if curl -fsS "$base/" 2>/dev/null | grep -q "局域网互传"; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::服务 30 秒内未就绪（端口 $port）；服务端日志: $(tail -12 "$log" | tr '\n' '|' | cut -c1-1000)"
            exit 1
          fi
          echo "服务已就绪"
          echo "::notice::[2] server ready on $port"

          # 逐个尝试并真实执行一遍，避免命中 Windows 应用商店占位程序
          py=""
          for cand in python3 python py; do
            if command -v "$cand" >/dev/null 2>&1 && "$cand" -c 'import sys' >/dev/null 2>&1; then
              py="$cand"
              break
            fi
          done
          if [ -z "$py" ]; then
            echo "::error::未找到可用的 Python 解释器（python3 / python / py 都不可执行）"
            exit 1
          fi
          echo "python  : $py ($("$py" -V 2>&1))"
          echo "::notice::[3] python=$py"

          "$py" scripts/e2e_test.py "$base" 2>&1 | tee "$out"
          code="${PIPESTATUS[0]}"
          if [ "$code" -ne 0 ]; then
            echo "::error::端到端测试失败 exit=$code；输出开头: $(head -25 "$out" | tr '\n' '|' | cut -c1-1400)"
            echo "::error::测试输出末尾: $(tail -20 "$out" | tr '\n' '|' | cut -c1-1400)"
            echo "::error::服务端日志: $(tail -15 "$log" | tr '\n' '|' | cut -c1-900)"
            exit "$code"
          fi

          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo "::error::测试通过但服务进程已退出；服务端日志: $(tail -15 "$log" | tr '\n' '|' | cut -c1-900)"
            exit 1
          fi
          echo "::notice::[4] e2e passed"
