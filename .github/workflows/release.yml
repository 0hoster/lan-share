name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cross:
    name: 交叉编译（单机产出全平台）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # runner 自带 rustup，跳过私有工具链安装，只补 zig + cargo-zigbuild
      - name: 准备交叉工具链
        env:
          SKIP_RUSTUP: "1"
        run: bash scripts/setup-cross.sh

      - name: 构建 Linux / Windows / macOS 产物
        run: bash scripts/build-cross.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: lan-share-dist
          path: dist/*
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lan-share-*.tar.gz
            dist/lan-share-*.zip
            dist/SHA256SUMS.txt

  native:
    name: 原生构建 + 端到端测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: target/release/lan-share
          - os: macos-latest
            bin: target/release/lan-share
          - os: windows-latest
            bin: target/release/lan-share.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建 release
        run: cargo build --release --locked

      - name: 代码规范（仅 Linux）
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings

      - name: 启动服务并跑端到端测试
        shell: bash
        run: |
          set -euo pipefail
          ./${{ matrix.bin }} --port 18080 --data-dir "$RUNNER_TEMP/lan-share-data" &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/e2e_test.py http://127.0.0.1:18080
