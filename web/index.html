<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>局域网互传 · lan-share</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 7v12M16 19l-4.5-4.5M16 19l4.5-4.5M9 24h14' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⇅</span>
      <div>
        <h1>局域网互传</h1>
        <p class="sub">同一 WiFi 下，浏览器即可互传文件</p>
      </div>
    </div>
    <div class="status">
      <span class="dot" id="ws-dot" title="实时连接状态"></span>
      <span id="ws-text">连接中…</span>
      <span class="sep">·</span>
      <span id="stats-text">0 个文件</span>
    </div>
  </header>

  <div class="statbar" id="statbar">
    <span class="stat" title="浏览器到服务端的往返延迟">
      <span class="signal" id="signal-bars"><i></i><i></i><i></i><i></i></span>
      <span id="signal-text">测速中…</span>
    </span>
    <span class="stat">传输中 <b id="stat-active">0</b></span>
    <span class="stat">剩余 <b id="stat-remaining">0</b> 个文件 · <b id="stat-remaining-bytes">0 B</b></span>
    <span class="stat">分段 <b id="stat-chunks">0/0</b></span>
    <span class="stat">直播 <b id="stat-live">0</b> 路</span>
    <span class="stat" id="stat-server">服务端 —</span>
  </div>

  <main>
    <nav class="tabs" id="tabs">
      <button class="tab active" type="button" data-tab="files">文件传输</button>
      <button class="tab" type="button" data-tab="live">直播录屏</button>
    </nav>

    <div class="panel" data-panel="files">
    <section class="card">
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖拽文件上传">
        <div class="dz-icon">⬆</div>
        <p class="dz-title">把文件拖到这里，或 <span class="link">点击选择</span></p>
        <p class="dz-hint">支持多文件、超大文件；自动分片并行上传，速度更快</p>
        <input id="file-input" type="file" multiple hidden />
      </div>

      <div class="settings">
        <label class="field">
          <span>上传并发</span>
          <select id="upload-concurrency">
            <option value="1">1（最省带宽）</option>
            <option value="2">2</option>
            <option value="4" selected>4（推荐）</option>
            <option value="6">6</option>
            <option value="8">8（最快）</option>
          </select>
        </label>
        <label class="field">
          <span>下载并发</span>
          <select id="download-concurrency">
            <option value="1">1（最省带宽）</option>
            <option value="2">2</option>
            <option value="4" selected>4（推荐）</option>
            <option value="6">6</option>
            <option value="8">8（最快）</option>
          </select>
        </label>
        <span class="hint" id="chunk-hint">分片 8 MiB</span>
      </div>
    </section>

    <section class="card" id="tasks-card" hidden>
      <div class="card-head">
        <h2>传输队列</h2>
        <button class="ghost" id="clear-finished" type="button">清除已完成</button>
      </div>
      <ul class="tasks" id="task-list"></ul>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>共享文件 <span class="count" id="file-count"></span></h2>
        <div class="head-actions">
          <input id="search" type="search" placeholder="搜索文件名…" autocomplete="off" />
          <button class="ghost" id="refresh" type="button">刷新</button>
        </div>
      </div>
      <ul class="files" id="file-list"></ul>
      <p class="empty" id="empty-state">还没有文件，拖一个上来试试。</p>
    </section>
    </div>

    <div class="panel" data-panel="live" hidden>
      <section class="card">
        <div class="card-head">
          <h2>开始直播</h2>
          <span class="hint" id="live-support"></span>
        </div>
        <div class="live-form">
          <input id="live-title" type="text" maxlength="60" placeholder="直播标题（可选，例如：会议室大屏）" />
          <div class="live-opts">
            <label class="field"><input type="checkbox" id="live-record" checked /> 保存录像到服务器</label>
            <label class="field"><input type="checkbox" id="live-mic" /> 同时采集麦克风</label>
          </div>
          <div class="live-buttons">
            <button class="act primary" id="live-start-screen" type="button">共享屏幕开播</button>
            <button class="act" id="live-start-camera" type="button">摄像头开播</button>
          </div>
        </div>
        <div id="live-self" hidden>
          <video id="live-preview" muted playsinline></video>
          <div class="meta" id="live-stats"></div>
          <button class="act danger" id="live-stop" type="button">结束直播</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>正在直播 <span class="count" id="live-count"></span></h2>
          <button class="ghost" id="live-refresh" type="button">刷新</button>
        </div>
        <ul class="files" id="live-list"></ul>
        <p class="empty" id="live-empty">当前没有直播。点上面的按钮，把你的屏幕共享给局域网里的其他人。</p>
      </section>

      <section class="card" id="live-player-card" hidden>
        <div class="card-head">
          <h2 id="live-player-title">观看直播</h2>
          <button class="ghost" id="live-leave" type="button">关闭</button>
        </div>
        <video id="live-player" controls playsinline autoplay></video>
        <div class="meta" id="live-player-status"></div>
      </section>
    </div>
  </main>

  <footer class="foot">
    <span id="foot-info"></span>
  </footer>

  <div class="toasts" id="toasts"></div>
  <script src="/app.js"></script>
  <script src="/live.js"></script>
</body>
</html>
